# Render Blueprint for the BRIGHTHOMES API (Django + DRF). The website is deployed separately on Vercel.
#
# Free-plan notes: the web service sleeps after 15 minutes without traffic, has no shell and no persistent
# disk, so migrations and the (idempotent) seed commands run on every start, and uploaded/seeded images are
# stored in Cloudinary (CLOUDINARY_URL). Secrets marked `sync: false` are entered in the Render dashboard
# and are never committed.
services:
  - type: web
    name: brighthomes-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements/production.txt && python manage.py collectstatic --noinput
    startCommand: >-
      python manage.py migrate --noinput &&
      python manage.py seed_company_content &&
      python manage.py seed_illustrative_content &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: brighthomes-db
          property: connectionString
      # Entered in the dashboard (never committed):
      - key: CLOUDINARY_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      # No SMTP account is configured for the demo: password-reset emails are written to the service log.
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend

databases:
  - name: brighthomes-db
    plan: free
    databaseName: brighthomes
